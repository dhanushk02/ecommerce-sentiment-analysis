<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/dashboardstyle.css') }}">
</head>
<body>
    <!-- Top Navigation -->
    <nav class="top-nav">
        <div class="nav-left">
            <div class="logo">ShopEase</div>
            <ul class="nav-menu">
                <li><a href="/adminhome" class="{% if request.path == '/admin' %}active{% endif %}">Dashboard</a></li>
                <li><a href="/AdminCategoriesList" class="{% if request.path == '/admin/categories' %}active{% endif %}">Categories</a></li>
                <li><a href="/AdminProductsList" class="{% if request.path == '/admin/products' %}active{% endif %}">Products</a></li>
                <li><a href="/AdminOrdersList" class="{% if request.path == '/admin/orders' %}active{% endif %}">Orders</a></li>
                <li><a href="/AdminUsersList" class="{% if request.path == '/admin/users' %}active{% endif %}">Users</a></li>
                <li><a href="/AdminProductListReview" class="{% if request.path == '/admin/reviews' %}active{% endif %}">Reviews</a></li>
            </ul>
            
        </div>
        <div class="nav-right">
            <a href="{{ url_for('adminlogout') }}" class="btn btn-outline-light logout-btn">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
            
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <div class="content-header">
            <h2>{% block page_title %}Dashboard{% endblock %}</h2>
        </div>

        <div class="content-body">
            {% block content %}{% endblock %}
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 ShopEase. All Rights Reserved.</p>
    </footer>
</body>
</html>
